<html>
    <head>
        <style>
            .image 
            {
                animation: fadeIn 15s;
                font-size:32px;
                font-weight:bold;
                font-family:arial;
                background-color: orange;
                color:blue;
            }
            @keyframes fadeIn 
            {
                0% {opacity: 0;}
                100% {opacity: 1;}
            }
        </style>
    </head>
<body>
    <div class="image">
        <p>Welcome to Java Programming</p>
    </div>
</body>
</html>
