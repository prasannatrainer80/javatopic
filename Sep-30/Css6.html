<!DOCTYPE html>
<html>
<head>
<style>
.box {
width: 100px;
height: 100px;
background: orange;
margin-top:100px;
padding:10px;
animation: rotate 3s linear infinite;
}

@keyframes rotate {
from {
transform: rotate(0deg);
}
to {
transform: rotate(360deg);
}
}
</style>
</head>

<body>
<div class="box">
	CRT
</div>
</body>
</html>
