<!DOCTYPE html>
<html>
<head>
    <style>
        .zoombox {
            color: green;
            background: blue;
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 10vw;
            font-family: Arial;
            font-weight: bold;

            animation: zoomeffect 5s ease infinite;
        }

        @keyframes zoomeffect {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.5);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="zoombox">
        Welcome to CSS
    </div>
</body>
</html>
